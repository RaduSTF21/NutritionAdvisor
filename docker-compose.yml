services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrition_user
      POSTGRES_PASSWORD: nutrition_pass
      POSTGRES_DB: nutrition_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: NutritionAdvisor.API/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # The following values are expected to be provided via .env (see .env.example)
      # ConnectionStrings__DefaultConnection, Jwt__Key, Jwt__Issuer, Jwt__Audience,
      # PythonAI__BaseUrl, Stripe__SecretKey, Stripe__WebhookSecret, Stripe__Domain
    ports:
      - "5066:8080"
    volumes:
      - ./NutritionAdvisor.API/wwwroot/UploadedFiles:/app/wwwroot/UploadedFiles
    depends_on:
      - postgres
      - ai_service

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "5210:80"

  ai_service:
    build:
      context: NutritionAdvisor.AI
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"

volumes:
  postgres_data: